name: Luna

options:
  minimumXcodeGenVersion: "2.46.0"
  createIntermediateGroups: true

packages:
  BrowserKit:
    path: BrowserKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6 language mode already enables the concurrency upcoming features.
    # ExistentialAny is the one Swift-7-bound feature worth having from day one.
    # INTERNAL_IMPORTS_BY_DEFAULT / MEMBER_IMPORT_VISIBILITY are deliberately off:
    # they change public API spelling and buy nothing yet.
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # M0 signs ad-hoc ("Sign to Run Locally"). No certificate exists yet and none
    # is needed to run locally. Real signing — Developer ID + notarisation — is M4
    # (TODO.md §24.4, D8), and the §31.1 iCloud spike is what first requires it.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_ENTITLEMENTS: ""
    DEVELOPMENT_TEAM: ""
    # Hardened runtime lands with real signing in M4 (TODO.md §24).
    ENABLE_HARDENED_RUNTIME: "NO"
    # App Sandbox stays OFF on purpose: it blocks default-browser registration,
    # which is why the Mac App Store is ruled out (TODO.md §22.1, D8).
    ENABLE_APP_SANDBOX: "NO"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  Luna:
    type: application
    platform: macOS
    settings:
      base:
        PRODUCT_NAME: Luna
        PRODUCT_BUNDLE_IDENTIFIER: dk.novapps.luna
        INFOPLIST_FILE: App/Info.plist
        # Names the Icon Composer bundle below, minus its .icon extension.
        # actool compiles it into Assets.car and writes CFBundleIconName for us.
        ASSETCATALOG_COMPILER_APPICON_NAME: luna
    sources:
      - path: App
        excludes:
          - Info.plist
      # Referenced so it shows up in Xcode, never copied into Resources.
      - path: App/Info.plist
        buildPhase: none
      - path: UI
      - path: Design
      - path: Features
      # The icon stays with the rest of the artwork rather than moving into the
      # app sources; it is a build input, not code.
      - path: assets/icon/final/luna.icon
        type: file
        buildPhase: resources
      # The same mark at both appearances, for the surfaces inside the app
      # that draw it. The document above compiles to one flattened image:
      # `NSImage(named:)` hands back the light rendition whatever the window
      # is wearing, so first run showed a white tile on a dark page.
      - path: assets/icon/mark/Mark.xcassets
    dependencies:
      - package: BrowserKit

  LunaTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        # The app supplies its own Info.plist; a test bundle has nothing to
        # supply, so it needs the generated one the base settings turn off.
        GENERATE_INFOPLIST_FILE: "YES"
    # Tests live at the repo root, not under UI/: the app target compiles that
    # whole path, so a test file there would ship inside the app.
    sources:
      - path: Tests
    dependencies:
      - target: Luna

schemes:
  Luna:
    build:
      targets:
        Luna: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LunaTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
